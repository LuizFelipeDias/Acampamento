# Infraestrutura compartilhada entre Codespaces e ambiente local.
# Localmente: `docker compose up -d db` e rode backend/frontend na máquina.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-acampamento}
      POSTGRES_USER: ${DB_USER:-acampamento}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-acampamento}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
